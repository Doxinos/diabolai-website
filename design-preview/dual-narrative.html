<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diabol AI - Dual Narrative</title>
<style>
  /* 1. RESET & BASICS */
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    background-color: #000; /* Fallback */
  }

  /* 2. THE BACKGROUND: Radial Gradient Oxford Blue */
  .bg-gradient {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    /* Center is Oxford Blue, fading to deep black/blue at edges */
    background: radial-gradient(circle at center, #0A2843 0%, #00050a 100%);
    z-index: 0;
  }

  /* 3. THE TEXTURE: SVG Noise Overlay */
  .noise-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.07; /* Subtle grain */
    pointer-events: none;
    filter: contrast(120%) brightness(100%);
  }

  /* 4. THE CONTAINER */
  .container {
    position: relative;
    z-index: 2; /* Sits above background & noise */
    height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none; /* Optional: Hide default cursor for immersion */
  }

  /* 5. TYPOGRAPHY */
  .content {
    font-size: 5rem; /* Large headline size */
    font-weight: 800;
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
  }

  /* LAYER A: THE "FORMAL" TEXT (Dimmed State) */
  .formal {
    /* Westar Grey with low opacity */
    color: rgba(220, 219, 211, 0.25);
  }

  /* LAYER B: THE "HONEST" TEXT (Lit State) */
  .honest {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;

    color: #FFFFFF; /* Pure White */
    pointer-events: none;

    /* The Flashlight Mask Logic */
    --x: 50%;
    --y: 50%;
    mask-image: radial-gradient(circle 250px at var(--x) var(--y), black 100%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle 250px at var(--x) var(--y), black 100%, transparent 100%);
  }

  /* 6. ACCENTS */
  .highlight {
    color: #FF4F30; /* Portland Orange */
    text-shadow: 0 0 30px rgba(255, 79, 48, 0.6); /* Neon Glow */
  }

  /* Mobile responsiveness */
  @media (max-width: 768px) {
    .content { font-size: 3rem; }
    .honest {
      mask-image: radial-gradient(circle 150px at 50% 50%, black 100%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle 150px at 50% 50%, black 100%, transparent 100%);
    }
  }
</style>
</head>
<body>

  <!-- Layer 1: Gradient Background -->
  <div class="bg-gradient"></div>

  <!-- Layer 2: Noise Texture (Base64 SVG for performance) -->
  <div class="noise-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%221%22/%3E%3C/svg%3E');"></div>

  <!-- Layer 3: The Content -->
  <div class="container">

    <!-- The Dim/Formal Layer -->
    <div class="content formal">
      We build <br>
      corporate AI solutions.
    </div>

    <!-- The Lit/Honest Layer -->
    <div class="content honest">
      We build <br>
      <span class="highlight">dangerous</span> intelligence.
    </div>

  </div>

  <script>
    const honestLayer = document.querySelector('.honest');
    const container = document.querySelector('.container');

    // Track mouse movement
    document.addEventListener('mousemove', (e) => {
      honestLayer.style.setProperty('--x', e.clientX + 'px');
      honestLayer.style.setProperty('--y', e.clientY + 'px');
    });

    // Optional: Touch support for mobile
    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      honestLayer.style.setProperty('--x', touch.clientX + 'px');
      honestLayer.style.setProperty('--y', touch.clientY + 'px');
    });
  </script>

</body>
</html>
